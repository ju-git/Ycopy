[package]
name = "ycopy"
version = "0.1.0"
edition = "2024"
description = "Copy files to two destinations with a single read of each source"
license = "GPL-3.0-only"

[dependencies]
native-windows-gui = { version = "1.0.13", default-features = false, features = [
    "listbox", "combobox", "status-bar", "progress-bar", "file-dialog", "notice",
    "embed-resource",
] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
